<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="container">
        <!-- 1st box -->
    <div id="firstbox">
        <div id="button1">
            <button>Player X</button>
        </div>


        <div id="image1">
            <img src="https://thumbs.dreamstime.com/b/enthusiastic-d-cartoon-boy-waving-hello-big-smile-isolated-black-background-vibrant-detailed-d-rendering-431648273.jpg" alt="image of a child playing football" id="pic1">
        </div>
        <!-- end of firstbox -->
    </div>


    <div id="game">
        <h1>Tic Tac Toe</h1>
<!-- jo boxes hain unko alag se div tag me rhenge aur unko uppar grid apply krenge  -->
        <div id="parent">
        <div class="same" id="0"></div>
        <div class="same" id="1"></div>
        <div class="same" id="2"></div>
        <div class="same" id="3"></div>
        <div class="same" id="4"></div>
        <div class="same" id="5"></div>
        <div class="same" id="6"></div>
        <div class="same" id="7"></div>
        <div class="same" id="8"></div>
        <!-- end of parent -->
</div>


<div id="buttonelement">
        <button>Restart Game</button>
        </div>

        <div id="last"></div>
        <!-- end of game -->
    </div>

<!-- 3rd box -->
  <div id="thirdbox">
        <div id="button3">
            <button>Player 0</button>
        </div>


        <div id="image3">
            <img src="https://thumbs.dreamstime.com/b/full-length-portrait-adorable-stylized-d-avatar-young-boy-standing-confidently-dressed-casual-attire-including-431657139.jpg" alt="image of a child playing football" id="pic3">
        </div>
        <!-- end of firstbox -->
    </div>
    
    <!-- end of container -->
     </div>
    
    <script src="./scripit.js"></script>
</body>
</html>
